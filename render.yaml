services:
  - type: web
    name: aas-booking
    runtime: python
    rootDir: server
    plan: free               # no disk; Outlook is the record, token comes from env
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - {key: ALLOWED_ORIGIN, value: "https://work-all-companies.github.io"}
      - {key: AAS_CALENDAR_ID, value: "AQMkADAwATMwMAExLWFhAGM2LWRhMjIALTAwAi0wMAoARgAAAy_ukLmpw9RCpVlFRrF6q4gHAFH8jMBOIGRCjo1Tvq4LPwoAAAIBBgAAAFH8jMBOIGRCjo1Tvq4LPwoAAAFbjvYAAAA="}
      - {key: MS_CLIENT_ID, sync: false}
      - {key: MS_REFRESH_TOKEN, sync: false}
