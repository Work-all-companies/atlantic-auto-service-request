name: Refresh busy times
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: busy, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q icalendar recurring-ical-events
      - run: python scripts/build_busy.py
        env: {AAS_ICS_URL: "${{ secrets.AAS_ICS_URL }}"}
      - run: |
          if [ -n "$(git status --porcelain busy.json)" ]; then
            git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add busy.json && git commit -m "Update busy times" && git push
          fi
